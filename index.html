<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Eagle Sports Club</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07152d;
color:white;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
background:#0b2c66;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
z-index:1000;
box-shadow:0 3px 10px rgba(0,0,0,.5);
}

.logo{
font-size:28px;
font-weight:bold;
color:white;
}

.logo span{
color:#00bfff;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-size:17px;
transition:.3s;
}

nav a:hover{
color:#00bfff;
}

.hero{
height:100vh;
background:url("https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1600&q=80") center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}

.hero::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,50,.65);
}

.hero-content{
position:relative;
z-index:2;
max-width:700px;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
margin-bottom:30px;
}

.search-box{
display:flex;
justify-content:center;
}

.search-box input{
width:70%;
padding:16px;
border:none;
font-size:18px;
outline:none;
}

.search-box button{
padding:16px 25px;
background:#00bfff;
border:none;
color:white;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<header>

<div class="logo">
🦅 White <span>Eagle</span>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Matches</a>
<a href="#">Photos</a>
<a href="#">Highlights</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>White Eagle Sports Club</h1>

<p>Cricket • Match Schedule • Highlights • Gallery</p>

<div class="search-box">

<input type="text" placeholder="Search Match Photos...">

<button>🔍</button>

</div>

</div>

</section>
