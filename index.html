<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITD VoiceOver</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
text-align:center;
}

header{
background:#ff0000;
padding:20px;
}

header h1{
font-size:32px;
}

.hero{
padding:50px 20px;
}

.hero h2{
font-size:36px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
margin-bottom:30px;
}

.btn{
display:inline-block;
background:#ff0000;
color:white;
padding:15px 35px;
text-decoration:none;
border-radius:8px;
font-size:20px;
font-weight:bold;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

footer{
margin-top:50px;
padding:20px;
background:#222;
}
</style>
</head>

<body>

<header>
<h1>🎙 ITD VoiceOver</h1>
</header>

<section class="hero">
<h2>Welcome to ITD VoiceOver</h2>
<p>Latest Voice Over Videos, Shorts & Updates</p>

<a class="btn" href="https://youtube.com/@itdvoiceover" target="_blank">
🔴 Subscribe Now
</a>

</section>

<footer>
© 2026 ITD VoiceOver. All Rights Reserved.
</footer>

</body>
</html>
